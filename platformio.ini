[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino

upload_protocol = stlink    ; Change to 'dfu' or 'serial' if you aren't using ST-Link
monitor_speed = 115200



lib_deps = 
    stm32duino/STM32duino FreeRTOS@^10.3.2

build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740